name: Daily Papers Fetch & Publish

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      fetch_date:
        description: '처리 날짜 (YYYY-MM-DD). 비워두면 오늘 날짜.'
        required: false
        default: ''

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize DB
        run: python database/init_db.py

      - name: Migrate DB (v1.1)
        run: python database/migrate_v1.1.py

      - name: Run Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FETCH_DATE: ${{ github.event.inputs.fetch_date }}
        run: python agent/main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/hf_papers.db website/content/
          git diff --staged --quiet || git commit -m "daily: $(date +%Y-%m-%d) papers update"
          git push
