# Classics 시드 리스트 — 역대급 논문 큐레이션
# 매일 슬롯별 1편씩 라운드로빈 → 일간 논문과 함께 게시
#
# 규칙
#   - arxiv_id만 신뢰 가능한 ID. 변경 시 HF Papers API에 존재하는지 사전 검증 필수
#   - 한 슬롯 내 순서 = 노출 순서 (위에서부터 소진)
#   - 모든 슬롯 소진 시 처음으로 순환 (재등장 허용)
#   - 동일 논문이 일간 논문에 등장하면 그날 classics에서는 스킵
#
# 슬롯 분류 기준
#   foundation : 아키텍처/학습/효율/이론/생성 기반 (도메인 무관)
#   vision     : 비전 도메인 임팩트 (검출/세분화/ViT/생성/3D)
#   language   : LLM/NLP 도메인 임팩트 (사전학습/정렬/추론/RAG)

